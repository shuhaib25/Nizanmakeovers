<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nizan Makeovers | Power BI Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa, #e6ecf5);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 1s ease;
    }

    header h1 {
      font-size: 2.5rem;
      color: #2b2d42;
      font-weight: 700;
    }

    header p {
      color: #6c757d;
      margin-top: 5px;
      font-size: 1rem;
    }

    /* Navigation Buttons */
    .nav-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .nav-buttons button {
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #5f2eea, #00c6ff);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-buttons button.active {
      background: linear-gradient(135deg, #a3ddb3, #56e07d);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .dashboard-section {
      width: 95%;
      max-width: 1200px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: none;
      animation: fadeIn 0.8s ease;
    }

    .dashboard-section.active {
      display: block;
    }

    .section-header {
      padding: 20px;
      color: #fff;
      text-align: center;
    }

    .section-header h2 {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .dashboard-frame {
      padding: 20px;
      background-color: #f9fafc;
    }

    .dashboard-frame iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .dashboard-frame iframe {
        height: 450px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Nizan Makeovers</h1>
  <p>Review Meeting — Dashboard</p>
</header>

<!-- 🔹 Navigation Buttons -->
<div class="nav-buttons">
  <button id="salesBtn" class="active">Sales & Leads</button>
  <button id="staffBtn">Staff Performance</button>
  <button id="regionBtn">Region-wise Service Count</button>
</div>

<!-- 🔹 Sales & Leads -->
<div id="salesSection" class="dashboard-section active">
  <div class="section-header" style="background: linear-gradient(135deg, #56e07d, #a3ddb3);">
    <h2>Sales & Leads Dashboard</h2>
  </div>
  <div class="dashboard-frame">
    <!-- Your iframe already added -->
    <iframe src="https://app.powerbi.com/reportEmbed?reportId=55acf333-4a7d-4bc5-9032-53f0ffe62b9e&autoAuth=true&ctid=f5013204-8477-493f-9686-390532a27601"
      allowfullscreen="true"></iframe>
  </div>
</div>

<!-- 🔹 Staff Performance -->
<div id="staffSection" class="dashboard-section">
  <div class="section-header" style="background: linear-gradient(135deg, #5f2eea, #00c6ff);">
    <h2>Staff Performance Dashboard</h2>
  </div>
  <div class="dashboard-frame">
    <iframe src="https://app.powerbi.com/reportEmbed?reportId=22a9e16c-4d9c-48f2-9154-895e5fec75b7&autoAuth=true&ctid=f5013204-8477-493f-9686-390532a27601"
      allowfullscreen="true"></iframe>
  </div>
</div>

<!-- 🔹 Region-wise Service Count -->
<div id="regionSection" class="dashboard-section">
  <div class="section-header" style="background: linear-gradient(135deg, #ff9f43, #ff6f61);">
    <h2>Region-wise Service Count Dashboard</h2>
  </div>
  <div class="dashboard-frame">
    <iframe title="regionvise_count" width="1140" height="541.25" src="https://app.powerbi.com/reportEmbed?reportId=a74e1e3d-c0aa-479f-88c0-9e1579170634&autoAuth=true&ctid=f5013204-8477-493f-9686-390532a27601" frameborder="0" allowFullScreen="true"></iframe>
  </div>
</div>

<footer>
  © 2025 Nizan Makeovers | Dashboard Review Meeting
</footer>

<!-- 🔸 JavaScript -->
<script>
  const buttons = {
    salesBtn: 'salesSection',
    staffBtn: 'staffSection',
    regionBtn: 'regionSection'
  };

  Object.keys(buttons).forEach(btnId => {
    document.getElementById(btnId).addEventListener('click', () => {

      // Remove active from all buttons & sections
      document.querySelectorAll('.nav-buttons button')
        .forEach(btn => btn.classList.remove('active'));

      document.querySelectorAll('.dashboard-section')
        .forEach(section => section.classList.remove('active'));

      // Activate clicked button & section
      document.getElementById(btnId).classList.add('active');
      document.getElementById(buttons[btnId]).classList.add('active');
    });
  });
</script>

</body>
</html>
